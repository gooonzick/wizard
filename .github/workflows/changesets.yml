name: Changesets

on:
  push:
    branches:
      - main
  # Manual re-run: publishes any package whose local version is not on npm yet
  # (e.g. after a failed publish).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC). No npm token is used anywhere.
  id-token: write

jobs:
  release:
    name: Version or Publish
    # Trusted publishing only works on GitHub-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      # No dependency cache here: npm's trusted-publishing guidance is to never
      # restore caches into a build that publishes.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1. pnpm 10 delegates `pnpm publish`
      # to the npm CLI on PATH, so pin a recent npm explicitly.
      - name: Update npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # changesets/action v1 (compatible with @changesets/cli v2; v2 of the action
      # requires CLI v3). With NPM_TOKEN unset and OIDC available it skips writing
      # an .npmrc and npm uses trusted publishing.
      #
      # Every package has a trusted publisher on npmjs.com pointing at THIS file
      # (repository gooonzick/wizard, workflow changesets.yml); npm exchanges the
      # GitHub OIDC token for a short-lived publish token and attaches provenance
      # automatically. Renaming this file breaks publishing until the trusted
      # publisher settings on npmjs.com are updated.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: "pnpm changeset:version"
          publish: "pnpm release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
